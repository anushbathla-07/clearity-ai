<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearity AI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; max-width: 640px; }
      h1 { margin-bottom: 0.5rem; }
      p { color: #444; }
      form { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
      button { margin-top: 0.75rem; padding: 0.6rem 1rem; border: none; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Clearity AI - 4K Image Enhancer</h1>
    <p>
      Upload any image. The app applies non-generative enhancement (denoise, contrast,
      sharpening, and high-quality upscaling) to preserve face and identity details.
    </p>

    <form action="/enhance" method="post" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/*" required />
      <br />
      <button type="submit">Enhance to 4K</button>
    </form>
  </body>
</html>
